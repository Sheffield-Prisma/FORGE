[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "amazon-canopy-osr"
version = "0.1.0"
description = "Reproducible open-set recognition experiments for Amazon tree-crown imagery."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "Pillow>=10.0",
  "PyYAML>=6.0",
  "scikit-learn>=1.3",
  "torch>=2.1",
  "torchvision>=0.16",
  "tqdm>=4.66",
]

[project.optional-dependencies]
data = [
  "opencv-python>=4.8",
  "rasterio>=1.3",
]
plots = ["matplotlib>=3.7"]

[tool.setuptools.packages.find]
where = ["src"]

